[project]
name = "ai-quant-platform"
version = "0.3.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "polars>=1.44,<2.0",
  "pyarrow>=25,<26",
  "httpx>=0.28,<1.0",
  "pandas>=2.2,<4.0",
  "numpy>=2.0,<3.0",
]

[project.optional-dependencies]
trading = [
  "nautilus_trader==2.0.0rc4",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
