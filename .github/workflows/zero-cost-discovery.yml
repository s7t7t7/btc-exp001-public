name: BTC EXP-001 zero-cost Discovery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-exp001-discovery
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reproducible research dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Verify source and run offline tests
        run: |
          python scripts/verify_release.py
          python -m pytest -q
          python -m quant_platform.ingest.stdlib_selftest
          python -m quant_platform.ingest.snapshot_stdlib_selftest
      - name: Download, audit, freeze and compute Discovery only
        run: |
          python -m quant_platform.railway_job --mode full-discovery --store-uri quant-data --bootstrap-reps 500
      - name: Prepare evidence and audit artifact
        if: always()
        run: python scripts/package_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp001-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 3
          if-no-files-found: error
          compression-level: 9
